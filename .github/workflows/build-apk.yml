name: Build HavaPeyma APK 1.3.9 Hourly Forecast and Google Weather Search

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build and verify HavaPeyma 1.3.9
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract, patch and validate complete Android source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="$GITHUB_WORKSPACE/HavaPeyma_GitHub_Source_v1.3.7_DailyAnalysis_Rainfall_WidgetFix.zip"
          if [[ ! -s "$ZIP_PATH" ]]; then
            echo "::error::Required base source ZIP is missing: $ZIP_PATH"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/havapeyma-source" "$GITHUB_WORKSPACE/dist"
          unzip -q "$ZIP_PATH" -d "$RUNNER_TEMP/havapeyma-source"
          mapfile -t SETTINGS_FILES < <(find "$RUNNER_TEMP/havapeyma-source" -type f -name settings.gradle.kts -print)
          if [[ "${#SETTINGS_FILES[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one settings.gradle.kts; found ${#SETTINGS_FILES[@]}"
            exit 1
          fi
          PROJECT_DIR="$(dirname "${SETTINGS_FILES[0]}")"
          export PROJECT_DIR
          python3 scripts/patch_havapeyma_139.py
          test -s "$PROJECT_DIR/build.gradle.kts"
          test -s "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          grep -q 'applicationId = "com.example.havapeyma"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'versionName = "1.3.9"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'versionCode = 15' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'hourlyReports = hourlyByDate' "$PROJECT_DIR/app/src/main/java/com/example/havapeyma/MainActivity.kt"
          grep -q 'مشاهده هواشناسی گوگل' "$PROJECT_DIR/app/src/main/java/com/example/havapeyma/MainActivity.kt"
          grep -q 'openGoogleWeather' "$PROJECT_DIR/app/src/main/java/com/example/havapeyma/MainActivity.kt"
          mkdir -p "$PROJECT_DIR/.github/workflows"
          cp "$GITHUB_WORKSPACE/.github/workflows/build-apk.yml" "$PROJECT_DIR/.github/workflows/build-apk.yml"
          (cd "$PROJECT_DIR" && zip -qr "$GITHUB_WORKSPACE/dist/HavaPeyma_GitHub_Source_v1.3.9_HourlyForecast_GoogleWeather.zip" . -x '.gradle/*' 'app/build/*')
          rsync -a --exclude='/.github/' "$PROJECT_DIR/" "$GITHUB_WORKSPACE/"
          echo "Source validation passed for HavaPeyma 1.3.9."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK and prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$APK" ]]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi
          cp "$APK" dist/HavaPeyma-1.3.9-debug.apk

      - name: Upload APK and complete source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: HavaPeyma-1.3.9-HourlyForecast-GoogleWeather-APK-and-Source
          path: |
            dist/HavaPeyma-1.3.9-debug.apk
            dist/HavaPeyma_GitHub_Source_v1.3.9_HourlyForecast_GoogleWeather.zip
          if-no-files-found: error
