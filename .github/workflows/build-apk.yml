name: Build HavaPeyma APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract HavaPeyma 1.1.0 source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="HavaPeyma_GitHub_Source_v1.1.0.zip"
          if [ ! -s "$ZIP_PATH" ]; then
            echo "::error::Required source ZIP is missing: $ZIP_PATH"
            ls -la
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP_PATH" -d extracted
          SETTINGS="extracted/settings.gradle.kts"
          if [ ! -f "$SETTINGS" ]; then
            SETTINGS=$(find extracted -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)
          fi
          if [ -z "$SETTINGS" ] || [ ! -f "$SETTINGS" ]; then
            echo "::error::Gradle settings file not found inside source ZIP"
            find extracted -maxdepth 5 -type f
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          cp -a "$PROJECT_DIR/." .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HavaPeyma-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
