name: Build HavaPeyma APK 1.3.8 Hourly Forecast Daily Temperature Rain and Wind

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'HavaPeyma_GitHub_Source_v1.3.7_DailyAnalysis_Rainfall_WidgetFix.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build and verify HavaPeyma 1.3.8
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and add hourly forecast to source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="$GITHUB_WORKSPACE/HavaPeyma_GitHub_Source_v1.3.7_DailyAnalysis_Rainfall_WidgetFix.zip"
          if [[ ! -s "$ZIP_PATH" ]]; then
            echo "::error::Required base source ZIP is missing: $ZIP_PATH"
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/havapeyma-source"
          unzip -q "$ZIP_PATH" -d "$RUNNER_TEMP/havapeyma-source"
          mapfile -t SETTINGS_FILES < <(find "$RUNNER_TEMP/havapeyma-source" -type f -name settings.gradle.kts -print)
          if [[ "${#SETTINGS_FILES[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one settings.gradle.kts. Found ${#SETTINGS_FILES[@]}"
            exit 1
          fi
          PROJECT_DIR="$(dirname "${SETTINGS_FILES[0]}")"
          export PROJECT_DIR
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])
          main = root / "app/src/main/java/com/example/havapeyma/MainActivity.kt"
          gradle = root / "app/build.gradle.kts"
          src = main.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global src
              count = src.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one anchor for {label}, found {count}")
              src = src.replace(old, new, 1)

          replace_once(
              '    private lateinit var selectedDayAnalysis: TextView\n',
              '    private lateinit var selectedDayAnalysis: TextView\n'
              '    private lateinit var selectedDayHourly: TextView\n'
              '    private var hourlyReports: Map<String, List<HourlyForecast>> = emptyMap()\n',
              'hourly state fields')

          replace_once(
              '        dayCard.addView(selectedDayAnalysis)\n',
              '        dayCard.addView(selectedDayAnalysis)\n'
              '        val hourlyHeading = TextView(this).apply {\n'
              '            text = "گزارش ساعتی روز انتخاب‌شده"; textSize = 15f\n'
              '            setTextColor(0xFF176F86.toInt())\n'
              '            setTypeface(typeface, android.graphics.Typeface.BOLD)\n'
              '            setPadding(0, dp(12), 0, dp(4))\n'
              '        }\n'
              '        dayCard.addView(hourlyHeading)\n'
              '        selectedDayHourly = sectionText(13f, 0xFF294F5C.toInt())\n'
              '        dayCard.addView(selectedDayHourly)\n',
              'hourly report UI')

          replace_once(
              '&hourly=temperature_2m,precipitation_probability,uv_index,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m&daily=',
              '&hourly=temperature_2m,precipitation,precipitation_probability,uv_index,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m&daily=',
              'hourly precipitation API variable')

          replace_once(
              '                val hRain = hourlyData.optJSONArray("precipitation_probability")\n',
              '                val hRain = hourlyData.optJSONArray("precipitation_probability")\n'
              '                val hPrecip = hourlyData.optJSONArray("precipitation")\n',
              'hourly precipitation parsing')

          replace_once(
              '                val hWindGust = hourlyData.optJSONArray("wind_gusts_10m")\n',
              '                val hWindGust = hourlyData.optJSONArray("wind_gusts_10m")\n'
              '                val hourlyByDate = linkedMapOf<String, MutableList<HourlyForecast>>()\n'
              '                if (hTimes != null && hTemps != null) {\n'
              '                    for (i in 0 until minOf(hTimes.length(), hTemps.length())) {\n'
              '                        val timestamp = hTimes.optString(i)\n'
              '                        val date = timestamp.take(10)\n'
              '                        if (date.length != 10) continue\n'
              '                        hourlyByDate.getOrPut(date) { mutableListOf() }.add(\n'
              '                            HourlyForecast(\n'
              '                                time = timestamp.substringAfter(\'T\', "--:--").take(5),\n'
              '                                temperature = hTemps.optDouble(i, Double.NaN),\n'
              '                                precipitation = hPrecip?.optDouble(i, Double.NaN) ?: Double.NaN,\n'
              '                                precipitationProbability = hRain?.optDouble(i, Double.NaN) ?: Double.NaN,\n'
              '                                windSpeed = hWind?.optDouble(i, Double.NaN) ?: Double.NaN,\n'
              '                                windDirection = hWindDir?.optDouble(i, Double.NaN) ?: Double.NaN,\n'
              '                                windGust = hWindGust?.optDouble(i, Double.NaN) ?: Double.NaN\n'
              '                            )\n'
              '                        )\n'
              '                    }\n'
              '                }\n',
              'hourly forecast grouping')

          replace_once(
              '                        dailyAnalyses = dayMap\n',
              '                        dailyAnalyses = dayMap\n'
              '                        hourlyReports = hourlyByDate\n',
              'hourly forecast state update')

          replace_once(
              '            if (actual == null) append("\\nمبنای سال کشاورزی: ۱ مهر تا پایان شهریور؛ مجموع واقعی فقط در صورت دریافت داده تاریخی معتبر نمایش داده می‌شود.")\n'
              '        }\n',
              '            if (actual == null) append("\\nمبنای سال کشاورزی: ۱ مهر تا پایان شهریور؛ مجموع واقعی فقط در صورت دریافت داده تاریخی معتبر نمایش داده می‌شود.")\n'
              '        }\n'
              '        val hours = hourlyReports[selectedForecastDate].orEmpty()\n'
              '        selectedDayHourly.text = if (hours.isEmpty()) {\n'
              '            "گزارش ساعتی این روز در دسترس نیست."\n'
              '        } else buildString {\n'
              '            append("ساعت  |  دما  |  بارش  |  احتمال بارش  |  باد  |  تندباد\\n")\n'
              '            hours.forEach { hour ->\n'
              '                append("${hour.time}  |  ${format(hour.temperature)}°C  |  ${formatMm(hour.precipitation)} mm  |  ")\n'
              '                append("${format(hour.precipitationProbability)}٪  |  ${format(hour.windSpeed)} km/h ${windDirectionText(hour.windDirection)}  |  ${format(hour.windGust)} km/h\\n")\n'
              '            }\n'
              '        }\n',
              'hourly report rendering')

          replace_once(
              '    private data class DayForecast(\n',
              '    private data class HourlyForecast(\n'
              '        val time: String, val temperature: Double, val precipitation: Double,\n'
              '        val precipitationProbability: Double, val windSpeed: Double,\n'
              '        val windDirection: Double, val windGust: Double\n'
              '    )\n\n'
              '    private data class DayForecast(\n',
              'hourly forecast data class')

          main.write_text(src, encoding="utf-8")
          g = gradle.read_text(encoding="utf-8")
          if 'versionName = "1.3.7"' not in g or 'versionCode = 13' not in g:
              raise SystemExit("Unexpected base app version; refusing unsafe version bump")
          g = g.replace('versionName = "1.3.7"', 'versionName = "1.3.8"', 1)
          g = g.replace('versionCode = 13', 'versionCode = 14', 1)
          gradle.write_text(g, encoding="utf-8")
          print("Applied hourly forecast patch and bumped app to 1.3.8 (code 14).")
          PY

          test -s "$PROJECT_DIR/build.gradle.kts"
          test -s "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          grep -q 'applicationId = "com.example.havapeyma"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'versionName = "1.3.8"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'versionCode = 14' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'hourlyReports' "$PROJECT_DIR/app/src/main/java/com/example/havapeyma/MainActivity.kt"
          grep -q 'HourlyForecast' "$PROJECT_DIR/app/src/main/java/com/example/havapeyma/MainActivity.kt"
          grep -q 'precipitation,precipitation_probability' "$PROJECT_DIR/app/src/main/java/com/example/havapeyma/MainActivity.kt"
          grep -q 'گزارش ساعتی روز انتخاب‌شده' "$PROJECT_DIR/app/src/main/java/com/example/havapeyma/MainActivity.kt"
          grep -q 'Calendar.MONTH, 6' "$PROJECT_DIR/app/src/main/java/com/example/havapeyma/MainActivity.kt"
          grep -q 'filter { it.length == 10 }' "$PROJECT_DIR/app/src/main/java/com/example/havapeyma/MainActivity.kt"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          mkdir -p "$PROJECT_DIR/.github/workflows"
          cp "$GITHUB_WORKSPACE/.github/workflows/build-apk.yml" "$PROJECT_DIR/.github/workflows/build-apk.yml"
          (cd "$PROJECT_DIR" && zip -qr "$GITHUB_WORKSPACE/dist/HavaPeyma_GitHub_Source_v1.3.8_HourlyForecast_DailyRainWindTemp.zip" . -x '.gradle/*' 'app/build/*')
          rsync -a --exclude='/.github/' "$PROJECT_DIR/" "$GITHUB_WORKSPACE/"
          echo "Validated HavaPeyma 1.3.8 hourly forecast source."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK and prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$APK" ]]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi
          cp "$APK" dist/HavaPeyma-1.3.8-debug.apk

      - name: Upload APK and complete source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: HavaPeyma-1.3.8-HourlyForecast-APK-and-Source
          path: |
            dist/HavaPeyma-1.3.8-debug.apk
            dist/HavaPeyma_GitHub_Source_v1.3.8_HourlyForecast_DailyRainWindTemp.zip
          if-no-files-found: error
