name: Build HavaPeyma APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract HavaPeyma 1.2.2 source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="HavaPeyma_GitHub_Source_v1.2.2.zip"
          if [[ ! -s "$ZIP_PATH" ]]; then
            echo "::error::Required source ZIP is missing: $ZIP_PATH"
            ls -la
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/havapeyma-source"
          unzip -q "$ZIP_PATH" -d "$RUNNER_TEMP/havapeyma-source"
          mapfile -t SETTINGS_FILES < <(find "$RUNNER_TEMP/havapeyma-source" -type f -name settings.gradle.kts -print)
          if [[ "${#SETTINGS_FILES[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one settings.gradle.kts in source ZIP. Found ${#SETTINGS_FILES[@]}"
            find "$RUNNER_TEMP/havapeyma-source" -maxdepth 5 -type f -print
            exit 1
          fi
          PROJECT_DIR="$(dirname "${SETTINGS_FILES[0]}")"
          test -s "$PROJECT_DIR/build.gradle.kts"
          test -s "$PROJECT_DIR/app/build.gradle.kts"
          test -s "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          grep -q 'applicationId = "com.example.havapeyma"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'versionName = "1.2.2"' "$PROJECT_DIR/app/build.gradle.kts"
          test -s "$PROJECT_DIR/app/src/main/java/com/example/havapeyma/MainActivity.kt"
          test -s "$PROJECT_DIR/app/src/main/java/com/example/havapeyma/WeatherWidgetProvider.kt"
          if grep -nE '<View([[:space:]>])' "$PROJECT_DIR"/app/src/main/res/layout/widget_{small,medium,large}.xml; then
            echo "::error::Unsupported generic View found in a RemoteViews widget layout"
            exit 1
          fi
          rsync -a --exclude='/.github/' "$PROJECT_DIR/" "$GITHUB_WORKSPACE/"
          echo "Validated and extracted HavaPeyma 1.2.2 source."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HavaPeyma-1.2.2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
