name: Build HavaPeyma APK 1.3.6 Multi-Model Analysis

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'HavaPeyma_GitHub_Source_v1.3.6_OpenMeteoFix.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build and verify HavaPeyma 1.3.6 Open-Meteo fix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and validate source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="$GITHUB_WORKSPACE/HavaPeyma_GitHub_Source_v1.3.6_OpenMeteoFix.zip"
          if [[ ! -s "$ZIP_PATH" ]]; then
            echo "::error::Required source ZIP is missing: $ZIP_PATH"
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/havapeyma-source"
          unzip -q "$ZIP_PATH" -d "$RUNNER_TEMP/havapeyma-source"
          mapfile -t SETTINGS_FILES < <(find "$RUNNER_TEMP/havapeyma-source" -type f -name settings.gradle.kts -print)
          if [[ "${#SETTINGS_FILES[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one settings.gradle.kts. Found ${#SETTINGS_FILES[@]}"
            exit 1
          fi
          PROJECT_DIR="$(dirname "${SETTINGS_FILES[0]}")"
          test -s "$PROJECT_DIR/build.gradle.kts"
          test -s "$PROJECT_DIR/app/build.gradle.kts"
          test -s "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -s "$PROJECT_DIR/app/src/main/java/com/example/havapeyma/MainActivity.kt"
          test -s "$PROJECT_DIR/app/src/main/java/com/example/havapeyma/WeatherWidgetProvider.kt"
          grep -q 'applicationId = "com.example.havapeyma"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'versionName = "1.3.6"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'loadMultiModelAnalysis' "$PROJECT_DIR/app/src/main/java/com/example/havapeyma/MainActivity.kt"
          grep -q 'showMapPicker' "$PROJECT_DIR/app/src/main/java/com/example/havapeyma/MainActivity.kt"
          grep -q 'MapBridge' "$PROJECT_DIR/app/src/main/java/com/example/havapeyma/MainActivity.kt"
          grep -q 'tiles.openfreemap.org/styles/liberty' "$PROJECT_DIR/app/src/main/java/com/example/havapeyma/MainActivity.kt"
          grep -q 'ecmwf_ifs' "$PROJECT_DIR/app/src/main/java/com/example/havapeyma/MainActivity.kt"
          grep -q 'ncep_gfs_seamless' "$PROJECT_DIR/app/src/main/java/com/example/havapeyma/MainActivity.kt"
          grep -q 'icon_seamless' "$PROJECT_DIR/app/src/main/java/com/example/havapeyma/MainActivity.kt"
          grep -q 'HTTP $code' "$PROJECT_DIR/app/src/main/java/com/example/havapeyma/MainActivity.kt"
          ! grep -q 'hourly=time,' "$PROJECT_DIR/app/src/main/java/com/example/havapeyma/MainActivity.kt"
          grep -q 'hourly.optJSONArray("time")' "$PROJECT_DIR/app/src/main/java/com/example/havapeyma/MainActivity.kt"
          grep -q 'android:layout_width="50dp" android:layout_height="50dp"' "$PROJECT_DIR/app/src/main/res/layout/widget_small.xml"
          for layout in small medium large; do
            test -s "$PROJECT_DIR/app/src/main/res/layout/widget_${layout}.xml"
            grep -q 'widget_city_prev' "$PROJECT_DIR/app/src/main/res/layout/widget_${layout}.xml"
            grep -q 'widget_city_next' "$PROJECT_DIR/app/src/main/res/layout/widget_${layout}.xml"
            grep -q 'widget_refresh' "$PROJECT_DIR/app/src/main/res/layout/widget_${layout}.xml"
            if grep -nE '<View([[:space:]>])' "$PROJECT_DIR/app/src/main/res/layout/widget_${layout}.xml"; then
              echo "::error::Unsupported generic View found in RemoteViews layout: $layout"
              exit 1
            fi
            grep -q 'android:resizeMode="horizontal|vertical"' "$PROJECT_DIR/app/src/main/res/xml/widget_${layout}_info.xml"
          done
          rsync -a --exclude='/.github/' "$PROJECT_DIR/" "$GITHUB_WORKSPACE/"
          echo "Validated HavaPeyma 1.3.6 source."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK and prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$APK" ]]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/HavaPeyma-1.3.6-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HavaPeyma-1.3.6-OpenMeteoFix-debug-apk
          path: dist/HavaPeyma-1.3.6-debug.apk
          if-no-files-found: error
