name: Build HavaPeyma APK 1.3.1

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'HavaPeyma_GitHub_Source_v1.3.1.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build and verify HavaPeyma 1.3.1
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and validate HavaPeyma 1.3.1 source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH="$GITHUB_WORKSPACE/HavaPeyma_GitHub_Source_v1.3.1.zip"

          if [[ ! -s "$ZIP_PATH" ]]; then
            echo "::error::Required source ZIP is missing: $ZIP_PATH"
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/havapeyma-source"
          unzip -q "$ZIP_PATH" -d "$RUNNER_TEMP/havapeyma-source"

          mapfile -t SETTINGS_FILES < <(
            find "$RUNNER_TEMP/havapeyma-source" \
              -type f -name settings.gradle.kts -print
          )

          if [[ "${#SETTINGS_FILES[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one settings.gradle.kts. Found ${#SETTINGS_FILES[@]}"
            find "$RUNNER_TEMP/havapeyma-source" -maxdepth 6 -type f -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "${SETTINGS_FILES[0]}")"

          test -s "$PROJECT_DIR/build.gradle.kts"
          test -s "$PROJECT_DIR/app/build.gradle.kts"
          test -s "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -s "$PROJECT_DIR/app/src/main/java/com/example/havapeyma/MainActivity.kt"
          test -s "$PROJECT_DIR/app/src/main/java/com/example/havapeyma/WeatherWidgetProvider.kt"

          grep -q 'applicationId = "com.example.havapeyma"' \
            "$PROJECT_DIR/app/build.gradle.kts"

          grep -q 'versionName = "1.3.1"' \
            "$PROJECT_DIR/app/build.gradle.kts"

          for layout in small medium large; do
            test -s "$PROJECT_DIR/app/src/main/res/layout/widget_${layout}.xml"

            grep -q 'widget_city_prev' \
              "$PROJECT_DIR/app/src/main/res/layout/widget_${layout}.xml"

            grep -q 'widget_city_next' \
              "$PROJECT_DIR/app/src/main/res/layout/widget_${layout}.xml"

            if grep -nE '<View([[:space:]>])' \
              "$PROJECT_DIR/app/src/main/res/layout/widget_${layout}.xml"; then
              echo "::error::Unsupported generic View found in RemoteViews layout: $layout"
              exit 1
            fi

            grep -q 'android:resizeMode="horizontal|vertical"' \
              "$PROJECT_DIR/app/src/main/res/xml/widget_${layout}_info.xml"
          done

          rsync -a --exclude='/.github/' "$PROJECT_DIR/" "$GITHUB_WORKSPACE/"

          echo "Validated HavaPeyma 1.3.1 source."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK and prepare artifact
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK" ]]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi

          mkdir -p dist
          cp "$APK" dist/HavaPeyma-1.3.1-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HavaPeyma-1.3.1-debug-apk
          path: dist/HavaPeyma-1.3.1-debug.apk
          if-no-files-found: error
